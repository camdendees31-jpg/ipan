name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Briefcase
        run: pip install briefcase

      - name: Create Xcode project
        run: briefcase create iOS

      # Dynamically find the .xcodeproj so the name never needs to be hardcoded
      - name: Locate Xcode project
        id: locate
        run: |
          PROJECT=$(find iOS -name "*.xcodeproj" -maxdepth 4 | head -1)
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          echo "project=$PROJECT" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME"   >> $GITHUB_OUTPUT
          echo "Found project : $PROJECT"
          echo "Scheme        : $SCHEME"

      # Build (not archive) — output goes to a known directory we control
      - name: Build unsigned
        run: |
          xcodebuild build \
            -project "${{ steps.locate.outputs.project }}" \
            -scheme  "${{ steps.locate.outputs.scheme }}"  \
            -sdk iphoneos \
            -configuration Release \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/app_build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Package the .app into a sideloadable .ipa
      - name: Package IPA
        run: |
          APP=$(find "$RUNNER_TEMP/app_build" -name "*.app" -maxdepth 1 | head -1)
          echo "Packaging: $APP"
          mkdir Payload
          cp -r "$APP" Payload/
          zip -r CookieClicker.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CookieClicker-IPA
          path: CookieClicker.ipa
          retention-days: 7
