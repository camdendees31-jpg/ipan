name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Briefcase
        run: pip install briefcase

      - name: Create Xcode project
        run: |
          briefcase create iOS
          echo "=== xcodeproj locations ==="
          find . -name "*.xcodeproj" 2>/dev/null || echo "none found"

      # Locate + build in one step — avoids step-output escaping issues with spaces in names
      - name: Build unsigned
        run: |
          PROJECT=$(find . -name "*.xcodeproj" | head -1)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: no .xcodeproj found after briefcase create"
            exit 1
          fi
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          echo "Project : $PROJECT"
          echo "Scheme  : $SCHEME"

          xcodebuild build \
            -project "$PROJECT" \
            -scheme  "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/app_build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          APP=$(find "$RUNNER_TEMP/app_build" -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: no .app found in build output"
            ls "$RUNNER_TEMP/app_build" || true
            exit 1
          fi
          echo "Packaging: $APP"
          mkdir Payload
          cp -r "$APP" Payload/
          zip -r CookieClicker.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CookieClicker-IPA
          path: CookieClicker.ipa
          retention-days: 7
